<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land & Crop Recommender</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        :root {
            --primary-color: #2F855A;
            --primary-hover: #276749;
            --bg-color: #F0FFF4;
            --card-bg: #FFFFFF;
            --text-color: #2D3748;
            --border-color: #E2E8F0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #A0AEC0;
            cursor: not-allowed;
        }

        #map {
            width: 100%;
            height: 400px;
            border-radius: 8px;
            margin-bottom: 20px;
            background-color: #E2E8F0;
            z-index: 1;
            /* Fixes Leaflet rendering over elements */
        }

        .info-card {
            background-color: #EDF2F7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .info-card p {
            margin: 5px 0;
            font-size: 16px;
            font-weight: 500;
        }

        #recommend-btn {
            width: 100%;
        }

        #crop-recommendations {
            margin-top: 20px;
            padding: 15px;
            background-color: #EBF8FF;
            border-radius: 8px;
            border-left: 4px solid #3182CE;
            display: none;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .loader {
            display: none;
            text-align: center;
            font-weight: bold;
            color: var(--primary-color);
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Satellite Land & Crop Recommender</h1>

        <div class="input-group">
            <input type="text" id="location-input" placeholder="Enter a location (e.g., California, USA)"
                onkeypress="if(event.key === 'Enter') searchLocation()">
            <button onclick="searchLocation()">Search</button>
            <button onclick="useCurrentLocation()">📍 Use My Location</button>
        </div>

        <div id="map"></div>

        <div class="info-card" id="location-info">
            <p><strong>Address:</strong> <span id="address-display">Not selected</span></p>
            <p><strong>Selected Latitude:</strong> <span id="lat-display">-</span></p>
            <p><strong>Selected Longitude:</strong> <span id="lng-display">-</span></p>
        </div>

        <button id="recommend-btn" onclick="getCropRecommendations()" disabled>🌾 Recommend Crops for this
            Location</button>
        <div class="loader" id="loader">Analyzing geographical data and fetching recommendations...</div>

        <div id="crop-recommendations"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // Use the API key you provided
        const OPENROUTER_API_KEY = "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";

        let map;
        let marker;
        let selectedLat = null;
        let selectedLng = null;

        // Initialize Leaflet Map
        function initMap() {
            // Default center (e.g., center of the US)
            const defaultLocation = [39.8283, -98.5795];

            // Initialize map
            map = L.map('map', { attributionControl: false }).setView(defaultLocation, 4);

            // Add Esri World Imagery (Satellite view without needing an API key)
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19
            }).addTo(map);

            // Optional: Add OpenStreetMap roads/labels as a semitransparent overlay for context
            // L.tileLayer('https://stamen-tiles-{s}.a.ssl.fastly.net/toner-hybrid/{z}/{x}/{y}{r}.{ext}', {
            //     attribution: 'Map tiles by <a href="http://stamen.com">Stamen Design</a>, <a href="http://creativecommons.org/licenses/by/3.0">CC BY 3.0</a> &mdash; Map data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            //     subdomains: 'abcd',
            //     minZoom: 0,
            //     maxZoom: 20,
            //     ext: 'png'
            // }).addTo(map);

            // Add click listener to select land
            map.on('click', function (e) {
                placeMarker(e.latlng);
            });
        }

        // Place a marker and update selected coordinates
        function placeMarker(latlng) {
            if (marker) {
                marker.setLatLng(latlng);
            } else {
                marker = L.marker(latlng, { draggable: true }).addTo(map);

                // Update coordinates when the user drags the marker
                marker.on('dragend', function (e) {
                    const position = marker.getLatLng();
                    updateCoordinates(position.lat, position.lng);
                    map.panTo(position);
                });
            }

            map.panTo(latlng);
            updateCoordinates(latlng.lat, latlng.lng);
        }

        // Helper to update coordinates in the UI and fetch address
        async function updateCoordinates(lat, lng) {
            selectedLat = lat;
            selectedLng = lng;

            document.getElementById("lat-display").innerText = selectedLat.toFixed(6);
            document.getElementById("lng-display").innerText = selectedLng.toFixed(6);
            document.getElementById("recommend-btn").disabled = false;
            document.getElementById("address-display").innerText = "Fetching address...";

            // Clear previous recommendations
            document.getElementById("crop-recommendations").style.display = "none";
            document.getElementById("crop-recommendations").innerText = "";

            // Reverse Geocoding to get the address
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`, {
                    headers: {
                        'Accept-Language': 'en-US,en;q=0.9'
                    }
                });
                const data = await response.json();
                if (data && data.display_name) {
                    document.getElementById("address-display").innerText = data.display_name;
                } else {
                    document.getElementById("address-display").innerText = "Address not found";
                }
            } catch (error) {
                document.getElementById("address-display").innerText = "Error fetching address";
            }
        }

        // Search by text input using OpenStreetMap Nominatim API (Free geocoding)
        async function searchLocation() {
            const address = document.getElementById("location-input").value;
            if (!address) return alert("Please enter a location");

            try {
                // Fetch coordinates for the address using Nominatim
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1`, {
                    headers: {
                        'Accept-Language': 'en-US,en;q=0.9'
                    }
                });

                const data = await response.json();

                if (data && data.length > 0) {
                    const latlng = L.latLng(parseFloat(data[0].lat), parseFloat(data[0].lon));
                    map.setView(latlng, 14); // Zoom in closer
                    placeMarker(latlng);
                } else {
                    alert("Location not found. Please try a different query.");
                }
            } catch (error) {
                console.error(error);
                alert("Error searching location. Please try again later.");
            }
        }

        // Use Geolocation API
        function useCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const latlng = L.latLng(position.coords.latitude, position.coords.longitude);
                        map.setView(latlng, 18); // Zoom in very close
                        placeMarker(latlng);
                    },
                    (error) => {
                        alert("Error: The Geolocation service failed or permission was denied.");
                    }
                );
            } else {
                alert("Error: Your browser doesn't support geolocation.");
            }
        }

        // Fetch Crop Recommendations using OpenRouter AI
        async function getCropRecommendations() {
            if (!selectedLat || !selectedLng) return;

            const loader = document.getElementById("loader");
            const resultDiv = document.getElementById("crop-recommendations");
            const btn = document.getElementById("recommend-btn");

            btn.disabled = true;
            loader.style.display = "block";
            resultDiv.style.display = "none";

            const prompt = `Based on the geographical location at Latitude: ${selectedLat} and Longitude: ${selectedLng}, what are the best agricultural crops to grow on this land? Consider the general climate, soil types typical for this region, and seasonality. Give a concise but informative list. DO NOT provide coordinates back in the response, just the crop recommendation.`;

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": "openrouter/auto", // Uses OpenRouter's auto-routing to a functional available model
                        "messages": [
                            { "role": "user", "content": prompt }
                        ]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message || "Unknown API Error");
                }

                const aiResponse = data.choices[0].message.content;
                resultDiv.innerText = aiResponse;
                resultDiv.style.display = "block";

            } catch (error) {
                console.error(error);
                alert("Failed to get recommendations. Ensure your OpenRouter API key is valid. Error: " + error.message);
            } finally {
                loader.style.display = "none";
                btn.disabled = false;
            }
        }

        // Run setup when page is ready
        window.onload = initMap;
    </script>
</body>

</html>
